# FichaClara · CI
# Se ejecuta en cada pull request y en cada push a develop y main.
# El job se llama "tests": es el nombre que hay que marcar como
# "required status check" en la protección de ramas.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (PyTorch en versión CPU, más ligera)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Revisar estilo con ruff
        run: ruff check .

      - name: Ejecutar tests
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: dummy   # los tests no deben llamar a APIs reales: usad mocks
        run: pytest -v